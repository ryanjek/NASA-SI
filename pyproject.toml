[project]
name = "nasa-si"
version = "0.1.0"
description = "Explainable geospatial screening for Mars landing-site analogs"
readme = "README.md"
authors = [
    { name = "ryanjek", email = "ryanngjekhian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.19.0",
    "earthengine-api>=1.7.52",
    "geopandas>=1.2.0",
    "healpy>=1.20.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "planetary-computer>=1.0.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.7.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
nasa-si = "nasa_si.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_si"]

[tool.uv]
package = true
